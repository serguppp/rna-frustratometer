default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint and fixes
        entry: uv run --locked --no-sync ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: Ruff format
        entry: uv run --locked --no-sync ruff format
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: Mypy
        entry: uv run --locked --no-sync mypy
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: pytest
        name: Pytest
        entry: uv run --locked --no-sync python -m pytest -q
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
