default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint and fixes
        entry: uv run --locked --no-sync ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: Ruff format
        entry: uv run --locked --no-sync ruff format
        language: system
        types_or: [python, pyi]

      - id: frontend-lint
        name: Frontend lint
        entry: bun run --cwd frontend lint
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: frontend-format
        name: Frontend formatting
        entry: bun run --cwd frontend format:check
        language: system
        files: ^frontend/
        pass_filenames: false

      - id: mypy
        name: Mypy
        entry: uv run --locked --no-sync mypy
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: pytest
        name: Pytest
        entry: uv run --locked --no-sync pytest -q
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: frontend-build
        name: Frontend typecheck and build
        entry: bun run --cwd frontend build
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true