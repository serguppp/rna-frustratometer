[project]
name = "rna-frustratometer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "serguppp", email = "serg.urbaniak@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gemmi>=0.7.5",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
backend = [
    "fastapi[standard]>=0.156.3",
]

[tool.uv]
default-groups = ["dev", "backend"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "."]
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["src", "backend"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"